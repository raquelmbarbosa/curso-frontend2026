<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria da Turma — Projetos dos Alunos</title>
<style>
  :root{
    --navy: #F5F9FC;
    --panel: #FFFFFF;
    --code-bg: #EFF6FB;
    --border-soft: #D8E7F2;
    --cyan: #2E6FA8;
    --teal: #8FCB9A;
    --yellow: #D9822B;
    --rose: #D9822B;
    --ink: #16324A;
    --ink-soft: #5F7C90;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--navy);
    color:var(--ink);
    font-family:'Calibri','Segoe UI',Arial,sans-serif;
  }
  .hero{
    padding:64px 40px 40px 40px;
    text-align:center;
    border-bottom:1px solid rgba(22,50,74,.1);
  }
  .hero .eyebrow{
    font-family:'Courier New',monospace;
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--cyan);
    margin-bottom:14px;
  }
  .hero h1{
    font-family:'Cambria',Georgia,serif;
    font-size:42px;
    margin:0 0 12px 0;
  }
  .hero p{
    color:var(--ink-soft);
    font-size:16px;
    max-width:560px;
    margin:0 auto;
  }
  .grid{
    max-width:1180px;
    margin:0 auto;
    padding:48px 32px 80px 32px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:28px;
  }
  .card{
    background:var(--panel);
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--border-soft);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 30px rgba(22,50,74,.14);
  }
  .browser-chrome{
    background:var(--code-bg);
    padding:9px 12px;
    display:flex;
    align-items:center;
    gap:8px;
    border-bottom:1px solid rgba(22,50,74,.08);
  }
  .dot{ width:9px; height:9px; border-radius:50%; }
  .dot.r{ background:var(--rose); }
  .dot.y{ background:var(--yellow); }
  .dot.g{ background:var(--teal); }
  .addr{
    flex:1;
    background:rgba(22,50,74,.06);
    border-radius:5px;
    font-family:'Courier New',monospace;
    font-size:11px;
    color:var(--ink-soft);
    padding:4px 9px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-left:4px;
  }
  .preview{
    position:relative;
    width:100%;
    aspect-ratio:16/10;
    background:linear-gradient(135deg, var(--code-bg), var(--panel));
    overflow:hidden;
  }
  .preview img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:top;
    display:block;
  }
  .fallback{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cambria',Georgia,serif;
    font-size:44px;
    font-weight:700;
    color:rgba(22,50,74,.25);
  }
  .info{ padding:16px 18px 18px 18px; }
  .info .name{
    font-family:'Cambria',Georgia,serif;
    font-size:17px;
    margin:0 0 2px 0;
  }
  .info .proj{
    color:var(--ink-soft);
    font-size:13.5px;
    margin:0 0 14px 0;
  }
  .links{ display:flex; gap:8px; }
  .links a{
    flex:1;
    text-align:center;
    text-decoration:none;
    font-size:12.5px;
    font-weight:700;
    padding:8px 10px;
    border-radius:7px;
    font-family:'Calibri','Segoe UI',Arial,sans-serif;
  }
  .btn-live{ background:var(--cyan); color:#FFFFFF; }
  .btn-live:hover{ filter:brightness(1.1); }
  .btn-code{ background:transparent; color:var(--ink); border:1px solid rgba(22,50,74,.2); }
  .btn-code:hover{ border-color:var(--ink); }
  .footer{
    text-align:center;
    padding:32px;
    color:var(--ink-soft);
    font-size:12.5px;
    border-top:1px solid rgba(22,50,74,.1);
  }
  .footer a{ color:var(--cyan); }
</style>
</head>
<body>

<div class="hero">
  <div class="eyebrow">Curso de Front-End · Turma 2026</div>
  <h1>Galeria da Turma</h1>
  <p>Projetos desenvolvidos pelos alunos ao longo do curso — cada card leva ao site publicado e ao código-fonte no GitHub.</p>
</div>

<div class="grid" id="gallery"></div>

<div class="footer">
  Publicado com GitHub Pages · <a href="#">github.com/raquelmbarbosa/portfolios-turma</a>
</div>

<script>
  // ======================================================
  // EDITE AQUI: um objeto por aluno.
  // - name: nome do aluno
  // - project: título do projeto (ex: "Mini-Projeto 1 — FrontConf")
  // - liveUrl: link do site publicado (GitHub Pages do aluno)
  // - repoUrl: link do repositório no GitHub
  // - previewImg: opcional. Se deixar em branco, a galeria gera
  //   um preview automático a partir do liveUrl.
  // ======================================================
  const students = [
    {
      name: "Bernardo Silveira",
      project: "Mini-Projeto 1 — FrontEventos",
      liveUrl: "https://bernardosilveira2204-pixel.github.io/site-evento/",
      repoUrl: "https://bernardosilveira2204-pixel.github.io/site-evento/",
      previewImg: ""
    },
    {
      name: "Francine Moraes",
      project: "Mini-Projeto 1 — FrontEventos",
      liveUrl: "https://frangnmoraes.github.io/site-evento/index.html",
      repoUrl: "https://frangnmoraes.github.io/site-evento/index.html",
      previewImg: ""
    },
    {
      name: "Grazielli Scholante ",
      project: "Mini-Projeto 1 — FrontEventos",
      liveUrl: "https://grazielli-07.github.io/site-evento/",
      repoUrl: "https://grazielli-07.github.io/site-evento/",
      previewImg: ""
    },
    {
      name: "Larissa Soares",
      project: "Mini-Projeto 1 — FrontEventos",
      liveUrl: "https://larissasoares2297.github.io/site-evento/",
      repoUrl: "https://larissasoares2297.github.io/site-evento/",
      previewImg: ""
    }
  ];

  const accentClasses = ["r","y","g"];

  function screenshotUrl(liveUrl){
    // Serviço gratuito de captura de tela automática (sem chave de API).
    // Se preferir mais confiabilidade, troque por um print manual em previewImg.
    return `https://api.microlink.io/?url=${encodeURIComponent(liveUrl)}&screenshot=true&meta=false&embed=screenshot.url`;
  }

  function shortUrl(url){
    return url.replace(/^https?:\/\//,'');
  }

  function initials(name){
    return name.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();
  }

  const gallery = document.getElementById("gallery");

  students.forEach((s, i)=>{
    const img = s.previewImg || screenshotUrl(s.liveUrl);
    const dotColor = accentClasses[i % accentClasses.length];

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="browser-chrome">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <div class="addr">${shortUrl(s.liveUrl)}</div>
      </div>
      <div class="preview">
        <div class="fallback" style="background:linear-gradient(135deg, var(--code-bg), var(--panel));">${initials(s.name)}</div>
        <img src="${img}" alt="Preview de ${s.project}" loading="lazy"
             onerror="this.style.display='none'">
      </div>
      <div class="info">
        <p class="name">${s.name}</p>
        <p class="proj">${s.project}</p>
        <div class="links">
          <a class="btn-live" href="${s.liveUrl}" target="_blank" rel="noopener">Ver site ↗</a>
          <a class="btn-code" href="${s.repoUrl}" target="_blank" rel="noopener">Código ↗</a>
        </div>
      </div>
    `;
    gallery.appendChild(card);
  });
</script>

</body>
</html>
