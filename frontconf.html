<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrontConf — Portfólios da Turma</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <a href="index.html">&larr; Voltar aos portfólios</a>
</div>

<div class="header">
  <div class="kicker">Mini-Projeto 1</div>
  <h1>FrontConf</h1>
  <p>Site de divulgação de um evento fictício, com cinco seções obrigatórias: sobre, programação, palestrantes, inscrição e contato.</p>
</div>

<div class="grid" id="gallery"></div>

<div class="footer">
  Curso de Front-End 2026 · Publicado com GitHub Pages
</div>

<script>
  // ======================================================
  // EDITE AQUI: um objeto por aluno que publicou este projeto.
  // ======================================================
  const students = [
    {
      name: "Bernardo Silveira",
      liveUrl: "https://bernardosilveira2204-pixel.github.io/site-evento/",
      repoUrl: "https://github.com/bernardosilveira2204-pixel/site-evento",
      previewImg: ""
    },
    {
      name: "Bernardo Terra",
      liveUrl: "https://bernardosilveira2204-pixel.github.io/site-evento/",
      repoUrl: "https://github.com/bernardosilveira2204-pixel/site-evento",
      previewImg: ""
    },
    {
      name: "Bruna Ayadinne",
      liveUrl: "https://ayhadinne.github.io/evento/",
      repoUrl: "https://github.com/ayhadinne/evento",
      previewImg: ""
    },
    {
      name: "Francine Moraes",
      liveUrl: "https://frangnmoraes.github.io/site-evento/index.html",
      repoUrl: "https://github.com/frangnmoraes/site-evento",
      previewImg: ""
    },
    {
      name: "Grazielli Scholante",
      liveUrl: "https://grazielli-07.github.io/site-evento/index.html",
      repoUrl: "https://github.com/grazielli-07/site-evento",
      previewImg: ""
    },
    {
      name: "Larissa Farias",
      liveUrl: "https://larissasoares2297.github.io/site-evento/",
      repoUrl: "https://github.com/larissasoares2297/site-evento",
      previewImg: ""
    },
    {
      name: "Lucca Menestrino",
      liveUrl: "https://lccswrld03.github.io/site-evento/",
      repoUrl: "https://github.com/lccswrld03/site-evento",
      previewImg: ""
    },
  ];

  const accentClasses = ["r","y","g"];

  function screenshotUrl(liveUrl){
    return `https://api.microlink.io/?url=${encodeURIComponent(liveUrl)}&meta=false&screenshot=&embed=screenshot.url`;
  }
  function shortUrl(url){ return url.replace(/^https?:\/\//,''); }
  function initials(name){ return name.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase(); }

  const gallery = document.getElementById("gallery");

  if(students.length === 0){
    gallery.innerHTML = `<div class="empty-note">Nenhum projeto publicado ainda.</div>`;
  } else {
    students.forEach((s)=>{
      const img = s.previewImg || screenshotUrl(s.liveUrl);
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="browser-chrome">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <div class="addr">${shortUrl(s.liveUrl)}</div>
        </div>
        <div class="preview">
          <!-- <div class="fallback">${initials(s.name)}</div> -->
          <img src="${img}" alt="Preview de ${s.project}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="info">
          <p class="name">${s.name}</p>
          <!-- <p class="proj">${s.project}</p> -->
          <div class="links">
            <a class="btn-live" href="${s.liveUrl}" target="_blank" rel="noopener">Ver site ↗</a>
            <a class="btn-code" href="${s.repoUrl}" target="_blank" rel="noopener">Código ↗</a>
          </div>
        </div>
      `;
      gallery.appendChild(card);
    });
  }
</script>

</body>
</html>
