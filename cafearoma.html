<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Aroma & Cia — Portfólios da Turma</title>
<style>
  :root{
    --navy: #E1EDF7;
    --panel: #FFFFFF;
    --code-bg: #D6E7F5;
    --border-soft: #A9C9E0;
    --cyan: #14507F;
    --teal: #2E8C61;
    --yellow: #B8681A;
    --rose: #B03A57;
    --ink: #0B2438;
    --ink-soft: #3E5A70;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--navy);
    color:var(--ink);
    font-family:'Calibri','Segoe UI',Arial,sans-serif;
  }
  .topbar{
    max-width:1180px;
    margin:0 auto;
    padding:28px 32px 0 32px;
  }
  .topbar a{
    color:var(--ink-soft);
    text-decoration:none;
    font-size:13.5px;
    font-weight:700;
  }
  .topbar a:hover{ color:var(--ink); }

  .header{
    max-width:1180px;
    margin:0 auto;
    padding:24px 32px 40px 32px;
    border-bottom:1px solid rgba(11,36,56,.18);
  }
  .header .kicker{
    font-family:'Courier New',monospace;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--yellow);
    margin-bottom:8px;
  }
  .header h1{
    font-family:'Cambria',Georgia,serif;
    font-size:36px;
    margin:0 0 10px 0;
  }
  .header p{
    color:var(--ink-soft);
    font-size:15px;
    max-width:640px;
    line-height:1.6;
    margin:0;
  }

  .grid{
    max-width:1180px;
    margin:0 auto;
    padding:44px 32px 80px 32px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:26px;
  }
  .card{
    background:var(--panel);
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--border-soft);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 30px rgba(11,36,56,.22);
  }
  .browser-chrome{
    background:var(--code-bg);
    padding:9px 12px;
    display:flex;
    align-items:center;
    gap:8px;
    border-bottom:1px solid rgba(11,36,56,.16);
  }
  .dot{ width:9px; height:9px; border-radius:50%; }
  .dot.r{ background:var(--rose); }
  .dot.y{ background:var(--yellow); }
  .dot.g{ background:var(--teal); }
  .addr{
    flex:1;
    background:rgba(11,36,56,.1);
    border-radius:5px;
    font-family:'Courier New',monospace;
    font-size:11px;
    color:var(--ink-soft);
    padding:4px 9px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-left:4px;
  }
  .preview{
    position:relative;
    width:100%;
    aspect-ratio:16/10;
    background:linear-gradient(135deg, var(--code-bg), var(--panel));
    overflow:hidden;
  }
  .preview img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:top;
    display:block;
  }
  .fallback{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cambria',Georgia,serif;
    font-size:44px;
    font-weight:700;
    color:rgba(11,36,56,.38);
  }
  .info{ padding:16px 18px 18px 18px; }
  .info .name{
    font-family:'Cambria',Georgia,serif;
    font-size:17px;
    margin:0 0 2px 0;
  }
  .info .proj{
    color:var(--ink-soft);
    font-size:13.5px;
    margin:0 0 14px 0;
  }
  .links{ display:flex; gap:8px; }
  .links a{
    flex:1;
    text-align:center;
    text-decoration:none;
    font-size:12.5px;
    font-weight:700;
    padding:8px 10px;
    border-radius:7px;
    font-family:'Calibri','Segoe UI',Arial,sans-serif;
  }
  .btn-live{ background:var(--cyan); color:#FFFFFF; }
  .btn-live:hover{ filter:brightness(1.08); }
  .btn-code{ background:transparent; color:var(--ink); border:1px solid rgba(11,36,56,.32); }
  .btn-code:hover{ border-color:var(--ink); }

  .empty-note{
    grid-column:1/-1;
    padding:32px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    border:1px dashed var(--border-soft);
    border-radius:12px;
  }

  .footer{
    text-align:center;
    padding:32px;
    color:var(--ink-soft);
    font-size:12.5px;
    border-top:1px solid rgba(11,36,56,.16);
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html">&larr; Voltar aos portfólios</a>
</div>

<div class="header">
  <div class="kicker">Mini-Projeto 2</div>
  <h1>Café Aroma &amp; Cia</h1>
  <p>Site institucional para uma cafeteria fictícia, com foco em cardápio, identidade visual e responsividade — HTML fornecido como base, CSS aplicado pelo aluno.</p>
</div>

<div class="grid" id="gallery"></div>

<div class="footer">
  Curso de Front-End 2026 · Publicado com GitHub Pages
</div>

<script>
  // ======================================================
  // EDITE AQUI: um objeto por aluno que publicou este projeto.
  // ======================================================
  const students = [
    {
      name: "Bruna ",
      project: "Mini-Projeto 1 — Café Aroma",
      liveUrl: "https://ayhadinne.github.io/cafe-aroma/",
      repoUrl: "https://github.com/ayhadinne/cafe-aroma",
      previewImg: ""
    },
    {
      name: "Francine",
      project: "Mini-Projeto 1 — FrontEventos",
      liveUrl: "https://frangnmoraes.github.io/Cafe-Aroma/index.html",
      repoUrl: "https://github.com/frangnmoraes/Cafe-Aroma",
      previewImg: ""
    },
    {
      name: "Grazielli",
      project: "Mini-Projeto 1 — Café Aroma",
      liveUrl: "https://Grazielli-07.github.io/Cafe",
      repoUrl: "https://github.com/Grazielli-07/Cafe",
      previewImg: ""
    },
   {
      name: "Larissa",
      project: "Mini-Projeto 1 — Café Aroma",
      liveUrl: "https://larissasoares2297.github.io/cafe.aroma/",
      repoUrl: "https://github.com/larissasoares2297/cafe-aroma",
      previewImg: ""
    },
    {
      name: "Lucca",
      project: "Mini-Projeto 1 — Café Aroma",
      liveUrl: "https://lccswrld03.github.io/cafe-aroma/",
      repoUrl: "https://github.com/lccswrld03/cafe-aroma",
      previewImg: ""
    },
    {
      name: "Vithor",
      project: "Mini-Projeto 1 — Café Aroma",
      liveUrl: "https://vithorll.github.io/bfd-frontend/tree/main/week-08/activities/cafe-aroma-e-cia/cafearoma.html",
      repoUrl: "https://github.com/vithorll/bfd-frontend/tree/main/week-08/activities/cafe-aroma-e-cia",
      previewImg: ""
    },
  ];

  const accentClasses = ["r","y","g"];

  function screenshotUrl(liveUrl){
    return `https://api.microlink.io/?url=${encodeURIComponent(liveUrl)}&meta=false&screenshot=&embed=screenshot.url`;
  }
  function shortUrl(url){ return url.replace(/^https?:\/\//,''); }
  function initials(name){ return name.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase(); }

  const gallery = document.getElementById("gallery");

  if(students.length === 0){
    gallery.innerHTML = `<div class="empty-note">Nenhum projeto publicado ainda.</div>`;
  } else {
    students.forEach((s)=>{
      const img = s.previewImg || screenshotUrl(s.liveUrl);
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="browser-chrome">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <div class="addr">${shortUrl(s.liveUrl)}</div>
        </div>
        <div class="preview">
          <div class="fallback">${initials(s.name)}</div>
          <img src="${img}" alt="Preview de ${s.project}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="info">
          <p class="name">${s.name}</p>
          <p class="proj">${s.project}</p>
          <div class="links">
            <a class="btn-live" href="${s.liveUrl}" target="_blank" rel="noopener">Ver site ↗</a>
            <a class="btn-code" href="${s.repoUrl}" target="_blank" rel="noopener">Código ↗</a>
          </div>
        </div>
      `;
      gallery.appendChild(card);
    });
  }
</script>

</body>
</html>
